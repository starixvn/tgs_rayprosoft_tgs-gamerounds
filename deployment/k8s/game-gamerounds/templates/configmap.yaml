apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-gamerounds.fullname" . }}
  labels:
    {{- include "game-gamerounds.labels" . | nindent 4 }}
data:
  appsettings.json: |
    {
      "Logging": {
        "LogLevel": {
          "Default": "Warning"
           }
      },
      "GameLocked": {
        "LocksRedisKey": "gamerounds:lock:{0}:{1}:{2}:{3}",
        "LockSeconds": 60
      }
    }
  monitor.settings.json: |
    {
      "Metrics": {
        "MetricCount": "1"
      },
      "Logging":{
        "Console": {
          "FormatterName": "json"
        },
        "LogLevel": {
          "Default": "Warning",
          "Microsoft": "Warning",
          "Microsoft.Diagnostics": "Warning",
          "Microsoft.Hosting.Lifetime": "Information"
        }
      }
    }
