apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-gamerounds.fullname" . }}
  labels:
    {{- include "game-gamerounds.labels" . | nindent 4 }}
data:
  appsettings.json: |
    {
      "Logging": {
        "LogLevel": {
          "Default": "Warning"
           }
      }
    }
  monitor.settings.json: |
    {
      "Metrics": {
        "MetricCount": "1"
      },
      "Logging":{
        "Console": {
          "FormatterName": "json"
        },
        "LogLevel": {
          "Default": "Warning",
          "Microsoft": "Warning",
          "Microsoft.Diagnostics": "Warning",
          "Microsoft.Hosting.Lifetime": "Information"
        }
      }
    }
